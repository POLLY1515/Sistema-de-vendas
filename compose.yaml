services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistema-vendas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema-vendas"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      APP_FRONTEND_URL: http://localhost:3000

      JWT_SECRET: ${JWT_SECRET:-docker-local-chave-jwt-com-pelo-menos-32-caracteres}
      JWT_EXPIRACAO: 86400000

      DB_URL: jdbc:postgresql://db:5432/sistema-vendas
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./sistema-vendas-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_APP_ENV: docker
    depends_on:
      - backend
    ports:
      - "3000:3000"


volumes:
  postgres_data:
